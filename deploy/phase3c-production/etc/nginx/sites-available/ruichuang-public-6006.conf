upstream ruichuang_phase3c_public {
    server 127.0.0.1:8878;
    keepalive 32;
}

server {
    listen 6006 default_server;
    listen [::]:6006 default_server;
    server_name _;

    # The AutoDL ingress is the only trusted proxy hop. Resolve the right-most
    # untrusted address, then replace any client-supplied forwarding chain.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep schema discovery on loopback. Production clients use documented
    # versioned endpoints and do not need the interactive API explorer.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /chat {
        client_max_body_size 16m;
        include /etc/nginx/snippets/ruichuang-phase3c-proxy.conf;
    }

    location = /chat/stream {
        client_max_body_size 16m;
        include /etc/nginx/snippets/ruichuang-phase3c-proxy.conf;
    }

    location ^~ /tools/v1 {
        client_max_body_size 16m;
        include /etc/nginx/snippets/ruichuang-phase3c-proxy.conf;
    }

    location / {
        client_max_body_size 100m;
        include /etc/nginx/snippets/ruichuang-phase3c-proxy.conf;
    }
}
