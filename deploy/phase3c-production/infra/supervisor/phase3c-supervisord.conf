[unix_http_server]
file=/root/autodl-tmp/customer_agent_phase3/infra/run/supervisor.sock
chmod=0700

[supervisord]
user=root
logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/root/autodl-tmp/customer_agent_phase3/infra/run/supervisord.pid
childlogdir=/root/autodl-tmp/customer_agent_phase3/infra/logs
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/customer_agent_phase3/infra/run/supervisor.sock

[program:ruichuang-kes]
command=/root/autodl-tmp/customer_agent_phase3/infra/bin/kes server --config /root/autodl-tmp/customer_agent_phase3/infra/kes/config.yml
directory=/root/autodl-tmp/customer_agent_phase3/infra
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/kes.out.log
stderr_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/kes.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:ruichuang-guardian]
command=/bin/bash /root/autodl-tmp/customer_agent_phase3/infra/scripts/service_guardian.sh
directory=/root/autodl-tmp/customer_agent_phase3/app
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/guardian.out.log
stderr_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/guardian.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:ruichuang-maintenance]
command=/bin/bash /root/autodl-tmp/customer_agent_phase3/infra/scripts/daily_maintenance.sh
directory=/root/autodl-tmp/customer_agent_phase3/app
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/maintenance.out.log
stderr_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/maintenance.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:ruichuang-health-monitor]
command=/bin/bash /root/autodl-tmp/customer_agent_phase3/infra/scripts/health_monitor.sh
directory=/root/autodl-tmp/customer_agent_phase3/app
priority=25
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/health-monitor.out.log
stderr_logfile=/root/autodl-tmp/customer_agent_phase3/infra/logs/health-monitor.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
